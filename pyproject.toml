[project]
name = "polylens-bilibili-mcp"
version = "0.3.4"
description = "读取 B 站视频、评论、弹幕、字幕等公开信息的 MCP 服务，支持用 jq 在返回前筛选和裁剪结果，可本地运行，也可通过 HTTP + OAuth 远程接入。MCP server for reading Bilibili videos, comments, danmaku and subtitles, with jq filtering to keep responses small. Runs locally over stdio or remotely over Streamable HTTP with OAuth."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "liu-xindi" }]
requires-python = ">=3.13"
keywords = [
    "bilibili", "mcp", "mcp-server", "model-context-protocol", "claude", "jq", "danmaku", "subtitles",
    "remote-mcp", "streamable-http", "oauth", "claude-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jq>=1.12",
    # mcp 2.x 重命名了 FastMCP 并改动了服务端 API，升级需要改 server.py 与 oauth.py。
    # 1.30 起 FastMCP 才接受 session_idle_timeout，见 server.py。
    "mcp[cli]>=1.30,<2",
    "segno>=1.6",
]

[project.urls]
Homepage = "https://github.com/liu-xindi/polylens-bilibili-mcp"
Repository = "https://github.com/liu-xindi/polylens-bilibili-mcp"
Issues = "https://github.com/liu-xindi/polylens-bilibili-mcp/issues"
Changelog = "https://github.com/liu-xindi/polylens-bilibili-mcp/releases"

[project.scripts]
polylens-bilibili-mcp = "polylens_bilibili.__main__:main"
# 改名前的命令，已有部署仍在用。
polylens-bilibili = "polylens_bilibili.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/polylens_bilibili"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
