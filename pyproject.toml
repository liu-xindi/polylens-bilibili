[project]
name = "polylens-bilibili"
version = "0.1.0"
description = "从 B 站视频中提取信息的 MCP server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # mcp 2.x 重命名了 FastMCP 并改动了服务端 API，升级需要改 server.py 与 oauth.py。
    "mcp[cli]>=1.27,<2",
    "segno>=1.6",
]

[project.scripts]
polylens-bilibili = "polylens_bilibili.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polylens_bilibili"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
